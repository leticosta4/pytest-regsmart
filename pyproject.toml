[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-regsmart"
version = "0.3.4"
description = "A Pytest plugin for faster fault detection via regression test prioritization and selection."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "leticosta4", email = "leticiacostaoa@gmail.com" },
]
maintainers = [
  { name = "leticosta4", email = "leticiacostaoa@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "pytest>=9.0.3",
  "numpy",
  "pyan3>=1.2.0",
  "gitpython>=3.1.58",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
]
keywords = [
  "software testing",
  "regression testing",
  "test prioritization",
  "test selection",
  "pytest",
]

[project.urls]
Homepage = "https://github.com/leticosta4/pytest-regsmart"

[project.entry-points."pytest11"]
pytest_regsmart = "pytest_regsmart.plugin"

[dependency-groups]
dev = [
  "tox",
  "tox-uv",
  "pytest-xdist",
  "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["UP", "B"]
